<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Markdown Viewer</title>
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css"
		/>
		<link rel="stylesheet" href="{{htmlDir}}Markdown.css" />
	</head>
	<body {{if background}}class="custom-bg" style="background-image:url('{{background}}')"{{/if}}>
		<div class="deco-container">
			<div class="sparkle"></div>
			<div class="sparkle"></div>
			<div class="sparkle"></div>
			<div class="sparkle"></div>
			<div class="sparkle"></div>
			<div class="sparkle"></div>
			<div class="star-deco">&#10022;</div>
			<div class="star-deco">&#10022;</div>
			<div class="star-deco">&#10022;</div>
		</div>

		<div class="main-card">
			<div class="top-accent"></div>
			<div class="watermark">DOCS</div>

			<header class="header">
				<div class="brand">
					<h1>TRSS<span>.DOCS</span></h1>
					<p>Markdown Renderer</p>
				</div>
				<div style="text-align: right">
					<div class="date-badge" id="date">2026-04-12</div>
					<div class="mode-label">PREVIEW MODE</div>
				</div>
			</header>

			<article class="markdown-body">{{@Markdown}}</article>

			<footer class="footer">
				<div>&lt;/&gt; <span class="footer-info">TRSS-Plugin</span></div>
				<div>Powered by Markdown-It</div>
			</footer>
		</div>

		<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
		<script>
			document.querySelectorAll('pre code').forEach((el) => {
				hljs.highlightElement(el)
			})
			document.getElementById('date').innerText = new Date().toISOString().split('T')[0]
		</script>
	</body>
</html>
