<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Source Viewer</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" />
	<link rel="stylesheet" href="{{htmlDir}}SourceCode.css" />
</head>
<body {{if background}}class="custom-bg" style="background-image:url('{{background}}')"{{/if}}>
	<!-- 装饰粒子 -->
	<div class="deco-container">
		<div class="sparkle"></div>
		<div class="sparkle"></div>
		<div class="sparkle"></div>
		<div class="sparkle"></div>
		<div class="sparkle"></div>
		<div class="sparkle"></div>
		<div class="star-deco">✦</div>
		<div class="star-deco">✦</div>
		<div class="star-deco">✦</div>
	</div>

	<div class="main-card">
		<div class="top-accent"></div>
		
		<!-- 窗口头部 -->
		<header class="window-header">
			<div class="window-controls">
				<div class="control red"></div>
				<div class="control yellow"></div>
				<div class="control green"></div>
			</div>
			<div class="file-info">
				SOURCE CODE VIEWER
				<span class="file-suffix-badge">{{fileSuffix}}</span>
			</div>
			<div style="width: 50px"></div>
		</header>

		<!-- 代码区 -->
		<div class="code-box">
			<pre><code class="hljs" data-ln-start-from="{{lnStart}}">{{@SourceCode}}</code></pre>
		</div>

		<!-- 底部 -->
		<footer class="footer">
			<div class="footer-left">
				<span>&lt;/&gt;</span>
				TRSS-Plugin SOURCE
			</div>
			<div>LINE START: {{lnStart}} • 2026</div>
		</footer>
	</div>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/highlightjs-line-numbers.js/2.8.0/highlightjs-line-numbers.min.js"></script>
	<script>
		const suffix = '{{fileSuffix}}';
		if (hljs.getLanguage(suffix)) {
			document.querySelector('code').classList.add('language-' + suffix);
		}
		hljs.highlightAll();
		hljs.initLineNumbersOnLoad();
	</script>
</body>
</html>
