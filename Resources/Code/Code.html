<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>TRSS Terminal</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/tokyo-night-dark.min.css" />
	<link rel="stylesheet" href="{{htmlDir}}Code.css" />
</head>
<body {{if background}}class="custom-bg" style="background-image:url('{{background}}')"{{/if}}>
	<!-- 装饰粒子 -->
	<div class="deco-container">
		<div class="sparkle"></div>
		<div class="sparkle"></div>
		<div class="sparkle"></div>
		<div class="sparkle"></div>
		<div class="sparkle"></div>
		<div class="sparkle"></div>
		<div class="star-deco">✦</div>
		<div class="star-deco">✦</div>
		<div class="star-deco">✦</div>
	</div>

	<div class="main-card">
		<div class="top-accent"></div>
		<div class="watermark">RUN</div>

		<!-- 头部 -->
		<header class="header">
			<div class="brand">
				<div class="logo-box">&lt;/&gt;</div>
				<div class="brand-text">
					<h1>TRSS<span>.CMD</span></h1>
					<p>REMOTE RUNNER</p>
				</div>
			</div>
			<div class="status-group">
				<div class="status-item">
					<span class="time" id="current-time">--:--:--</span>
					<span class="sub">CST +8</span>
				</div>
				<div class="exec-badge">
					<span class="dot"></span>
					ACTIVE
				</div>
			</div>
		</header>

		<!-- 命令区 -->
		<section class="section">
			<div class="section-label">COMMAND</div>
			<div class="box command-preview">
				<span class="prompt">$</span>
				<span class="cmd-text">{{@cmd}}</span>
			</div>
		</section>

		<!-- 分隔线 -->
		<div class="divider">
			<div class="divider-left">$_ CMD</div>
			<div class="divider-line"></div>
			<div class="divider-right">STDOUT</div>
		</div>

		<!-- 输出区 -->
		<section class="section">
			<div class="section-label">OUTPUT</div>
			<div class="box output-area">
				<div class="code-wrapper">{{@Code}}</div>
			</div>
		</section>

		<!-- 底部 -->
		<footer class="footer">
			<div class="footer-left">
				<span class="footer-icon">&lt;&gt;</span>
				<span class="plugin-info">TRSS-Plugin v3.0</span>
			</div>
			<div class="footer-right">Powered by TRSS • 2026</div>
		</footer>
	</div>

	<script>
		function updateTime() {
			const now = new Date();
			document.getElementById('current-time').innerText = now.toTimeString().split(' ')[0];
		}
		updateTime();
	</script>
</body>
</html>
